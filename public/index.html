<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;D Online</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-box">
  <h1>&#9876;&#65039; D&amp;D Online</h1>
  <p class="auth-tagline">Build characters. Run campaigns. Play live.</p>

  <div class="panel">
    <div class="row" style="margin-bottom:14px;">
      <button id="tabLogin" style="flex:1;">Log In</button>
      <button id="tabRegister" class="secondary" style="flex:1;">Register</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" style="width:100%;">Enter the Tavern</button>
      <div class="error" id="loginError"></div>
    </form>

    <form id="registerForm" style="display:none;">
      <div class="field">
        <label>Username</label>
        <input type="text" id="regUsername" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" required minlength="6">
      </div>
      <button type="submit" style="width:100%;">Create Account</button>
      <div class="error" id="registerError"></div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

tabLogin.addEventListener('click', () => {
  loginForm.style.display = 'block';
  registerForm.style.display = 'none';
  tabLogin.classList.remove('secondary');
  tabRegister.classList.add('secondary');
});
tabRegister.addEventListener('click', () => {
  loginForm.style.display = 'none';
  registerForm.style.display = 'block';
  tabRegister.classList.remove('secondary');
  tabLogin.classList.add('secondary');
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    await api('POST', '/api/auth/login', {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    });
    window.location.href = '/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('registerError');
  errEl.textContent = '';
  try {
    await api('POST', '/api/auth/register', {
      username: document.getElementById('regUsername').value,
      email: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value
    });
    window.location.href = '/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
  }
});

// If already logged in, skip straight to dashboard
api('GET', '/api/auth/me').then(({ user }) => {
  if (user) window.location.href = '/dashboard.html';
});
</script>
</body>
</html>
